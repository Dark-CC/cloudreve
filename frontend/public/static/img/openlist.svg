<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" width="120" height="72" role="img" aria-label="OpenList">
  <defs>
    <linearGradient id="olBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbf8" />
      <stop offset="1" stop-color="#eef6ef" />
    </linearGradient>
    <linearGradient id="olBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb286" />
      <stop offset="1" stop-color="#237b52" />
    </linearGradient>
  </defs>

  <rect width="120" height="72" rx="10" fill="url(#olBg)" />
  <rect x="0.5" y="0.5" width="119" height="71" rx="10" fill="none" stroke="#dbe9df" />

  <!-- stacked drive plates -->
  <rect x="30" y="20" width="60" height="9" rx="4.5" fill="url(#olBody)" />
  <rect x="34" y="32" width="52" height="9" rx="4.5" fill="url(#olBody)" opacity="0.8" />
  <rect x="38" y="44" width="44" height="9" rx="4.5" fill="url(#olBody)" opacity="0.6" />

  <!-- list glyph: three rows of a directory listing -->
  <circle cx="33" cy="24.5" r="1.6" fill="#ffffff" opacity="0.9" />
  <circle cx="37" cy="36.5" r="1.6" fill="#ffffff" opacity="0.9" />
  <circle cx="41" cy="48.5" r="1.6" fill="#ffffff" opacity="0.9" />

  <!-- brand wordmark -->
  <text x="60" y="65" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif"
        font-size="10.5" font-weight="600" fill="#237b52" letter-spacing="0.5">OpenList</text>
</svg>
