name: Desktop Release

# Tag `desktop-v*` builds and publishes the Tauri desktop app for
# Windows, macOS and Linux. Server releases stay on the `v*` tags
# handled by release.yml (goreleaser).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    # Job-level env so the sparse-identity step can be skipped when the signing
    # certificate is not configured: an `if:` conditional cannot read `secrets`
    # directly, but it can read `env`. Without the secret the Windows installer
    # simply ships without the package-identity msix (installer-hooks.nsh tolerates
    # its absence); the rest of the bundle is unaffected.
    env:
      SPARSE_SIGNING_PFX_BASE64: ${{ secrets.SPARSE_SIGNING_PFX_BASE64 }}
      SPARSE_SIGNING_PFX_PASSWORD: ${{ secrets.SPARSE_SIGNING_PFX_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: desktop/ui/yarn.lock

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 fuse3

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: yarn install --frozen-lockfile

      # Build + sign the sparse identity package that gives the NSIS-installed
      # app package identity (Explorer context menu, packaged COM) without
      # Developer Mode. The msix + public cert land in package/ and the NSIS
      # hook (installer-hooks.nsh) files them into $INSTDIR when present.
      - name: Build signed sparse identity package
        if: runner.os == 'Windows' && env.SPARSE_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($ver.Split('.').Count -eq 3) { $ver = "$ver.0" }

          $stage = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sparse-pkg"
          $manifest = Get-Content desktop/package/AppxManifest.sparse.xml -Raw
          $manifest = $manifest -replace '__VERSION__', $ver -replace '__ARCH__', 'x64'
          [IO.File]::WriteAllText("$stage\AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding $true))
          Copy-Item desktop/package/Images "$stage\Images" -Recurse

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object { $_.FullName } | Select-Object -Last 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.FullName } | Select-Object -Last 1
          & $makeappx.FullName pack /o /d $stage /nv /p "$env:RUNNER_TEMP\Cloudreve-Identity.msix"
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          $pfx = "$env:RUNNER_TEMP\sparse-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SPARSE_SIGNING_PFX_BASE64))
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SPARSE_SIGNING_PFX_PASSWORD "$env:RUNNER_TEMP\Cloudreve-Identity.msix"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Copy-Item "$env:RUNNER_TEMP\Cloudreve-Identity.msix" desktop/package/Cloudreve-Identity.msix -Force

      # tauri-action runs `tauri build` (which triggers beforeBuildCommand ->
      # the UI build), produces the platform bundles and attaches them to the
      # GitHub release for the pushed tag. Bundle targets are pinned in
      # tauri.conf.json:
      #   Windows -> .exe (NSIS), macOS -> .dmg + .app.tar.gz,
      #   Linux -> .deb + .AppImage
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With the signing key set, tauri-action signs updater artifacts and
          # publishes latest.json on the release — the in-app updater feed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Cloudreve Desktop ${{ github.ref_name }}'
          # 中文发版说明：用户看到的第一个说明，把「默认中文」和「没有商业
          # 代码签名、可能被 SmartScreen / Gatekeeper 拦截」讲清楚。
          releaseBody: |
            Cloudreve 桌面客户端（Linux / macOS / Windows）。

            - 界面默认简体中文，可在设置页切换其它语言；应用名称保持 Cloudreve。
            - 本次起自动更新使用新的签名密钥：更早版本需手动安装一次本版，之后自动更新才可用。

            安装提示：安装包未做商业代码签名，这是正常现象。
            - Windows：SmartScreen 提示「已保护你的电脑」时，点「更多信息」→「仍要运行」。
            - macOS：首次打开被拦时，到「系统设置 → 隐私与安全性」点「仍要打开」，
              或执行：xattr -dr com.apple.quarantine /Applications/Cloudreve.app
            - Linux：.deb 需要 fuse3 / libwebkit2gtk-4.1 等依赖（包内已声明）。
          releaseDraft: false
          prerelease: false
